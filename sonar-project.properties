sonar.projectKey=drawhaus
sonar.projectName=drawhaus
sonar.sourceEncoding=UTF-8

sonar.sources=apps,packages
# parser/grammar: Peggy-generated parsers (~500KB dense JS); playground: demos.
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,e2e/**,**/parser/grammar/**,**/playground/**

# JS/TS analysis bridge Node heap (MB). 4096 OOM'd on the three.js/excalidraw
# frontend's type graph; runners have 16GB so 8192 is safe.
sonar.javascript.node.maxspace=8192

# Coverage (node:test --experimental-test-coverage → lcov). Monorepo: one report per workspace.
sonar.javascript.lcov.reportPaths=apps/backend/coverage/lcov.info,apps/frontend/coverage/lcov.info
