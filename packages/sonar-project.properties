sonar.projectKey=drawhaus-packages
sonar.projectName=drawhaus-packages
sonar.sourceEncoding=UTF-8

sonar.sources=.
# mermaid/plantuml converters drag d3+dagre+cytoscape+excalidraw type graphs that
# OOM the analysis bridge (74 files, still >4GB). Scope to the light first-party
# libs; the converters are near-vendored adapters with low analysis ROI.
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/__tests__/**,**/parser/grammar/**,**/playground/**,mermaid-to-excalidraw/**,plantuml-to-excalidraw/**

# Limit which tsconfigs load (exclusions don't stop tsconfig discovery → type loading).
sonar.typescript.tsconfigPaths=helpers/tsconfig.json,mcp/tsconfig.json
