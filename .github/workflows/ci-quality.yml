name: CI · Quality

on:
  workflow_dispatch:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Report-only: findings show in the job log without failing the check.
  # Set to "true" to make Semgrep, Trivy and Gitleaks block a merge.
  SECURITY_BLOCKING: "false"

jobs:
  semgrep:
    name: semgrep (SAST)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep:1.180.0@sha256:529ee8a277ec8adc5b534d7c74eea0a47e9de21d62852b6ba7ac6ba9566845c3
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Scan
        continue-on-error: ${{ env.SECURITY_BLOCKING != 'true' }}
        run: semgrep scan --config p/default --config p/security-audit --error

  trivy:
    name: trivy (deps + secrets + IaC)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        continue-on-error: ${{ env.SECURITY_BLOCKING != 'true' }}
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        continue-on-error: ${{ env.SECURITY_BLOCKING != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Free for personal accounts; a repo under an organization needs this secret.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run actionlint
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12 -color

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: false
          min-severity: medium

  sonar:
    # Opt-in and manual: runs on "Run workflow" only, and only where a SonarQube
    # server is configured (SONAR_HOST_URL variable + SONAR_TOKEN secret).
    # Monorepo → one Sonar project per workspace (own bridge = lower memory).
    # Each app has its own sonar-project.properties; scanned via projectBaseDir.
    if: ${{ github.event_name == 'workflow_dispatch' && vars.SONAR_HOST_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0 # full history → accurate "new code" / blame dates

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build workspace packages
        run: |
          npm run build --workspace=@drawhaus/helpers
          npm run build --workspace=@rodacato/drawhaus-mcp
          npm run build --workspace=@drawhaus/plantuml-to-excalidraw
          npm run build --workspace=@drawhaus/mermaid-to-excalidraw

      - name: Backend tests with coverage
        run: |
          mkdir -p apps/backend/coverage
          npm run test:coverage --workspace=backend

      - name: Frontend tests with coverage
        run: |
          mkdir -p apps/frontend/coverage
          npm run test:coverage --workspace=frontend

      # Two Sonar projects in one workflow (one bridge per workspace keeps the
      # JS/TS analyzer's memory footprint down). Frontend uses skipTypechecking
      # + maxspace=8192 in its sonar-project.properties to dodge OOM from the
      # three.js/excalidraw type graph. Packages are still unscanned for the
      # same reason — the Semgrep, Trivy and Gitleaks jobs cover them.
      - name: Scan backend
        uses: sonarsource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        with:
          projectBaseDir: apps/backend
          args: -Dsonar.projectVersion=${{ github.sha }}
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Scan frontend
        uses: sonarsource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        with:
          projectBaseDir: apps/frontend
          args: -Dsonar.projectVersion=${{ github.sha }}
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
