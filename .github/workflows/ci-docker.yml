name: CI · Docker Build

# Images are otherwise built only on a push to production, so a broken Dockerfile
# surfaced at deploy time. This builds both production targets without pushing.
on:
  pull_request:
    branches: [master, main]
    paths: &image-inputs
      - apps/**
      - packages/**
      - e2e/package.json
      - package.json
      - package-lock.json
      - .github/workflows/ci-docker.yml
  push:
    branches: [master, main]
    paths: *image-inputs

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.service }} image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          target: production
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}-ci
          # PRs can read the default branch's cache but only master pushes write it.
          cache-to: ${{ github.event_name == 'push' && format('type=gha,mode=max,scope={0}-ci', matrix.service) || '' }}
