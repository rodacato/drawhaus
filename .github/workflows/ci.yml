name: CI

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login to Docker Hub
        if: github.actor != 'dependabot[bot]'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build workspace packages
        run: |
          npm run build --workspace=@drawhaus/helpers
          npm run build --workspace=@drawhaus/mcp
          npm run build --workspace=@drawhaus/plantuml-to-excalidraw
          npm run build --workspace=@drawhaus/mermaid-to-excalidraw

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Frontend tests with coverage
        run: |
          mkdir -p apps/frontend/coverage
          npm run test:coverage --workspace=frontend

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: apps/frontend/coverage/lcov.info
          retention-days: 14
          if-no-files-found: warn

      - name: Backend tests
        run: npm run test --workspace=backend

      - name: Package tests
        run: npm run test:packages

  e2e:
    name: E2E Tests
    if: false # temporarily disabled — tests need fixing
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: drawhaus_test
          POSTGRES_USER: drawhaus
          POSTGRES_PASSWORD: drawhaus
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login to Docker Hub
        if: github.actor != 'dependabot[bot]'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Create .env for backend dev script
        run: touch .env

      - name: Build frontend
        run: npm run build --workspace=frontend

      - name: Run E2E tests
        run: npx playwright test
        working-directory: e2e
        env:
          DATABASE_URL: postgres://drawhaus:drawhaus@localhost:5432/drawhaus_test
          SESSION_SECRET: e2e-test-secret
          NODE_ENV: test
          PORT: "4000"
          FRONTEND_URL: http://localhost:5173
          REDIS_URL: redis://localhost:6379

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14
