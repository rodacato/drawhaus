name: Deploy

on:
  push:
    branches: [production]
  workflow_dispatch:
    inputs:
      action:
        description: "Kamal command (default `deploy`; pick `setup` for first-time bootstrap on a new host)"
        type: choice
        options:
          - deploy
          - setup
          - redeploy
        default: deploy

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  KAMAL_VERSION: "~> 2.7"
  RUBY_VERSION: "4.0"

jobs:
  build:
    name: Build backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Login to Docker Hub
        if: ${{ vars.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/backend/Dockerfile
          target: production
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/drawhaus-backend:latest
            ghcr.io/${{ github.repository_owner }}/drawhaus-backend:${{ github.sha }}
          build-args: GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy backend (${{ inputs.action || 'deploy' }})
    needs: build
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20

    env:
      ACTION: ${{ inputs.action || 'deploy' }}
      KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      HOST_IP: ${{ secrets.HOST_IP }}
      APP_HOST: ${{ vars.APP_HOST }}
      API_HOST: ${{ vars.API_HOST }}
      COOKIE_DOMAIN: ${{ vars.COOKIE_DOMAIN }}
      FROM_EMAIL: ${{ vars.FROM_EMAIL }}
      GH_CLIENT_ID: ${{ vars.GH_CLIENT_ID }}
      GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      METRICS_ENABLED: ${{ vars.METRICS_ENABLED || 'false' }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
      GH_CLIENT_SECRET: ${{ secrets.GH_CLIENT_SECRET }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      SENTRY_ENVIRONMENT: ${{ vars.SENTRY_ENVIRONMENT || 'production' }}
      SENTRY_TRACES_SAMPLE_RATE: ${{ vars.SENTRY_TRACES_SAMPLE_RATE || '0' }}
      SENTRY_RELEASE: ${{ github.sha }}

    steps:
      # Deploys ship only what master already has; branch protection on master makes that a tested commit.
      - name: Require a commit that is on master
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/master...$GITHUB_SHA" --jq .status)
          case "$status" in
            identical|behind) ;;
            *) echo "::error::$GITHUB_SHA is not on master ($status); only merged commits deploy"; exit 1 ;;
          esac

      - name: Require APP_HOST and API_HOST
        run: |
          for name in APP_HOST API_HOST; do
            [ -n "${!name}" ] || { echo "::error::Set the $name variable on the production environment"; exit 1; }
          done

      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}

      - name: Install Kamal
        run: gem install kamal -v "$KAMAL_VERSION"

      - name: Login to Docker Hub
        if: ${{ vars.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add host to known_hosts
        run: ssh-keyscan "$HOST_IP" >> ~/.ssh/known_hosts

      # Idempotent. Setup boots the accessories itself.
      - name: Boot accessories
        if: ${{ env.ACTION != 'setup' }}
        run: kamal accessory boot all --config-file config/deploy.backend.yml || true

      - name: Run kamal ${{ env.ACTION }}
        run: kamal "$ACTION" --config-file config/deploy.backend.yml

  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10

    env:
      APP_HOST: ${{ vars.APP_HOST }}
      API_HOST: ${{ vars.API_HOST }}

    steps:
      - name: Require APP_HOST and API_HOST
        run: |
          for name in APP_HOST API_HOST; do
            [ -n "${!name}" ] || { echo "::error::Set the $name variable on the production environment"; exit 1; }
          done

      - uses: actions/checkout@v7

      - name: Login to Docker Hub
        if: ${{ vars.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/frontend/Dockerfile
          target: production
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/drawhaus-frontend:latest
            ghcr.io/${{ github.repository_owner }}/drawhaus-frontend:${{ github.sha }}
          build-args: |
            VITE_API_URL=https://${{ vars.API_HOST }}
            VITE_WS_URL=https://${{ vars.API_HOST }}
            VITE_GOOGLE_API_KEY=${{ vars.VITE_GOOGLE_API_KEY }}
            VITE_SENTRY_DSN=${{ secrets.VITE_SENTRY_DSN }}
            VITE_SENTRY_ENVIRONMENT=${{ vars.VITE_SENTRY_ENVIRONMENT || vars.SENTRY_ENVIRONMENT || 'production' }}
            VITE_SENTRY_RELEASE=${{ github.sha }}
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT=${{ vars.SENTRY_PROJECT || 'drawhaus-frontend' }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy-frontend:
    name: Deploy frontend (${{ inputs.action || 'deploy' }})
    needs: [deploy, build-frontend]
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10

    env:
      ACTION: ${{ inputs.action || 'deploy' }}
      KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      HOST_IP: ${{ secrets.HOST_IP }}
      APP_HOST: ${{ vars.APP_HOST }}
      API_HOST: ${{ vars.API_HOST }}
      VITE_GOOGLE_API_KEY: ${{ vars.VITE_GOOGLE_API_KEY }}
      VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
      VITE_SENTRY_ENVIRONMENT: ${{ vars.VITE_SENTRY_ENVIRONMENT || vars.SENTRY_ENVIRONMENT || 'production' }}
      VITE_SENTRY_RELEASE: ${{ github.sha }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT || 'drawhaus-frontend' }}

    steps:
      # Deploys ship only what master already has; branch protection on master makes that a tested commit.
      - name: Require a commit that is on master
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/master...$GITHUB_SHA" --jq .status)
          case "$status" in
            identical|behind) ;;
            *) echo "::error::$GITHUB_SHA is not on master ($status); only merged commits deploy"; exit 1 ;;
          esac

      - name: Require APP_HOST and API_HOST
        run: |
          for name in APP_HOST API_HOST; do
            [ -n "${!name}" ] || { echo "::error::Set the $name variable on the production environment"; exit 1; }
          done

      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}

      - name: Install Kamal
        run: gem install kamal -v "$KAMAL_VERSION"

      - name: Login to Docker Hub
        if: ${{ vars.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add host to known_hosts
        run: ssh-keyscan "$HOST_IP" >> ~/.ssh/known_hosts

      - name: Run kamal ${{ env.ACTION }}
        run: kamal "$ACTION" --config-file config/deploy.frontend.yml
