# Standardized quality + security gate — calls rodacato/sector-7g.
# Update the reusable workflows there → this repo inherits the change.
name: Sector 7g - Quality

on:
  workflow_dispatch:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  security:
    uses: rodacato/sector-7g/.github/workflows/security.yml@master
    with:
      blocking: false # report-only for now; flip to true (or remove) to enforce

  sonar:
    # Manual-only for now: runs on "Run workflow", not on every push/PR.
    # Monorepo → one Sonar project per workspace (own bridge = lower memory).
    # Each app has its own sonar-project.properties; scanned via project_base_dir.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history → accurate "new code" / blame dates

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build workspace packages
        run: |
          npm run build --workspace=@drawhaus/helpers
          npm run build --workspace=@drawhaus/plantuml-to-excalidraw
          npm run build --workspace=@drawhaus/mermaid-to-excalidraw

      - name: Backend tests with coverage
        run: |
          mkdir -p apps/backend/coverage
          npm run test:coverage --workspace=backend

      - name: Frontend tests with coverage
        run: |
          mkdir -p apps/frontend/coverage
          npm run test:coverage --workspace=frontend

      # Two Sonar projects in one workflow (one bridge per workspace keeps the
      # JS/TS analyzer's memory footprint down). Frontend uses skipTypechecking
      # + maxspace=8192 in its sonar-project.properties to dodge OOM from the
      # three.js/excalidraw type graph. Packages are still unscanned for the
      # same reason — security.yml covers them.
      - name: Scan backend
        uses: rodacato/sector-7g/actions/sonar-scan@master
        with:
          host_url: ${{ vars.SONAR_HOST_URL }}
          token: ${{ secrets.SONAR_TOKEN }}
          project_base_dir: apps/backend

      - name: Scan frontend
        uses: rodacato/sector-7g/actions/sonar-scan@master
        with:
          host_url: ${{ vars.SONAR_HOST_URL }}
          token: ${{ secrets.SONAR_TOKEN }}
          project_base_dir: apps/frontend
