name: Quality

on:
  workflow_dispatch:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

env:
  # Report-only: findings show in the job log without failing the check.
  # Set to "true" to make Semgrep, Trivy and Gitleaks block a merge.
  SECURITY_BLOCKING: "false"

jobs:
  semgrep:
    name: semgrep (SAST)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Scan
        continue-on-error: ${{ env.SECURITY_BLOCKING != 'true' }}
        run: semgrep scan --config p/default --config p/security-audit --error

  trivy:
    name: trivy (deps + secrets + IaC)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Scan
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: ${{ env.SECURITY_BLOCKING != 'true' }}
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan
        uses: gitleaks/gitleaks-action@v3
        continue-on-error: ${{ env.SECURITY_BLOCKING != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Free for personal accounts; a repo under an organization needs this secret.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  sonar:
    # Opt-in and manual: runs on "Run workflow" only, and only where a SonarQube
    # server is configured (SONAR_HOST_URL variable + SONAR_TOKEN secret).
    # Monorepo → one Sonar project per workspace (own bridge = lower memory).
    # Each app has its own sonar-project.properties; scanned via projectBaseDir.
    if: ${{ github.event_name == 'workflow_dispatch' && vars.SONAR_HOST_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history → accurate "new code" / blame dates

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build workspace packages
        run: |
          npm run build --workspace=@drawhaus/helpers
          npm run build --workspace=@drawhaus/mcp
          npm run build --workspace=@drawhaus/plantuml-to-excalidraw
          npm run build --workspace=@drawhaus/mermaid-to-excalidraw

      - name: Backend tests with coverage
        run: |
          mkdir -p apps/backend/coverage
          npm run test:coverage --workspace=backend

      - name: Frontend tests with coverage
        run: |
          mkdir -p apps/frontend/coverage
          npm run test:coverage --workspace=frontend

      # Two Sonar projects in one workflow (one bridge per workspace keeps the
      # JS/TS analyzer's memory footprint down). Frontend uses skipTypechecking
      # + maxspace=8192 in its sonar-project.properties to dodge OOM from the
      # three.js/excalidraw type graph. Packages are still unscanned for the
      # same reason — the Semgrep, Trivy and Gitleaks jobs cover them.
      - name: Scan backend
        uses: sonarsource/sonarqube-scan-action@v8.2.0
        with:
          projectBaseDir: apps/backend
          args: -Dsonar.projectVersion=${{ github.sha }}
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Scan frontend
        uses: sonarsource/sonarqube-scan-action@v8.2.0
        with:
          projectBaseDir: apps/frontend
          args: -Dsonar.projectVersion=${{ github.sha }}
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
