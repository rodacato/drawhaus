# Standardized quality + security gate — calls rodacato/sector-7g.
# Update the reusable workflows there → this repo inherits the change.
name: Sector 7g - Quality

on:
  workflow_dispatch:
  push:
    branches: [master, main]
  pull_request:

jobs:
  security:
    uses: rodacato/sector-7g/.github/workflows/security.yml@master
    with:
      blocking: false # report-only for now; flip to true (or remove) to enforce

  sonar:
    # Manual-only for now: runs on "Run workflow", not on every push/PR.
    # Runs backend + frontend tests with coverage (node:test → one lcov per
    # workspace) before scanning. Mirrors the CI "validate" job's setup.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history → accurate "new code" / blame dates

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build workspace packages (types only)
        run: |
          npm run build --workspace=@drawhaus/helpers
          npx -w packages/plantuml-to-excalidraw tsc --emitDeclarationOnly
          npx -w packages/mermaid-to-excalidraw tsc --emitDeclarationOnly

      - name: Run tests with coverage
        run: |
          mkdir -p apps/backend/coverage apps/frontend/coverage
          npm run test:coverage --workspace=backend
          npm run test:coverage --workspace=frontend

      - name: SonarQube scan
        uses: rodacato/sector-7g/actions/sonar-scan@master
        with:
          host_url: ${{ vars.SONAR_HOST_URL }}
          token: ${{ secrets.SONAR_TOKEN }}
