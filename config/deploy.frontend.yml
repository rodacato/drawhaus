<%# The public hostnames every derived URL comes from. An empty host makes kamal-proxy route every hostname. %>
<% %w[APP_HOST API_HOST].each { |name| raise "#{name} must be set to a bare public hostname such as draw.example.com, got #{ENV[name].inspect}" unless ENV[name].to_s.match?(/\A[a-z0-9-]+(\.[a-z0-9-]+)+\z/i) } %>
<% %w[GITHUB_REPOSITORY_OWNER GITHUB_ACTOR HOST_IP].each { |name| raise "#{name} must be set; see .devcontainer/README.md to run Kamal outside GitHub Actions" if ENV[name].to_s.empty? } %>
service: drawhaus-frontend

# Image name without registry prefix; Kamal prepends `registry.server` automatically.
image: <%= ENV["GITHUB_REPOSITORY_OWNER"].downcase %>/drawhaus-frontend

ssh:
  user: deploy

servers:
  web:
    hosts:
      - <%= ENV.fetch("HOST_IP") %>

proxy:
  ssl: false
  host: <%= ENV["APP_HOST"] %>
  app_port: 80
  healthcheck:
    interval: 10
    path: /
    timeout: 5

registry:
  server: ghcr.io
  username: <%= ENV.fetch("GITHUB_ACTOR") %>
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  dockerfile: apps/frontend/Dockerfile
  target: production
  arch: amd64
  args:
    VITE_API_URL: "https://<%= ENV["API_HOST"] %>"
    VITE_WS_URL: "https://<%= ENV["API_HOST"] %>"
    VITE_GOOGLE_API_KEY: "<%= ENV.fetch("VITE_GOOGLE_API_KEY", "") %>"
    VITE_SENTRY_DSN: "<%= ENV.fetch("VITE_SENTRY_DSN", "") %>"
    VITE_SENTRY_ENVIRONMENT: "<%= ENV.fetch("VITE_SENTRY_ENVIRONMENT", "production") %>"
    VITE_SENTRY_RELEASE: "<%= ENV.fetch("VITE_SENTRY_RELEASE", "") %>"
    SENTRY_AUTH_TOKEN: "<%= ENV.fetch("SENTRY_AUTH_TOKEN", "") %>"
    SENTRY_ORG: "<%= ENV.fetch("SENTRY_ORG", "") %>"
    SENTRY_PROJECT: "<%= ENV.fetch("SENTRY_PROJECT", "") %>"
  cache:
    type: gha

logging:
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

# Every alias reuses the running container. Without it Kamal starts a fresh one,
# which means a registry login, which means a token nobody has outside CI.
aliases:
  shell: app exec --reuse --interactive 'sh'
  logs: app logs -f
