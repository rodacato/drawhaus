service: drawhaus-frontend

# Image name without registry prefix; Kamal prepends `registry.server` automatically.
image: rodacato/drawhaus-frontend

ssh:
  user: deploy

servers:
  web:
    hosts:
      - <%= ENV["HOST_IP"] %>

proxy:
  ssl: false
  host: drawhaus.notdefined.dev
  app_port: 80
  healthcheck:
    interval: 10
    path: /
    timeout: 5

registry:
  server: ghcr.io
  username: rodacato
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  context: .
  dockerfile: apps/frontend/Dockerfile
  target: production
  arch: amd64
  args:
    VITE_API_URL: "<%= ENV.fetch("VITE_API_URL", "") %>"
    VITE_WS_URL: "<%= ENV.fetch("VITE_WS_URL", "") %>"
    VITE_GOOGLE_API_KEY: "<%= ENV.fetch("VITE_GOOGLE_API_KEY", "") %>"
    VITE_SENTRY_DSN: "<%= ENV.fetch("VITE_SENTRY_DSN", "") %>"
    VITE_SENTRY_ENVIRONMENT: "<%= ENV.fetch("VITE_SENTRY_ENVIRONMENT", "production") %>"
    VITE_SENTRY_RELEASE: "<%= ENV.fetch("VITE_SENTRY_RELEASE", "") %>"
    SENTRY_AUTH_TOKEN: "<%= ENV.fetch("SENTRY_AUTH_TOKEN", "") %>"
    SENTRY_ORG: "<%= ENV.fetch("SENTRY_ORG", "") %>"
    SENTRY_PROJECT: "<%= ENV.fetch("SENTRY_PROJECT", "") %>"
  cache:
    type: gha

logging:
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

aliases:
  shell: app exec --interactive 'sh'
  logs: app logs -f
