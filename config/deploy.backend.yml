<%# The public hostnames every derived URL comes from. An empty host makes kamal-proxy route every hostname. %>
<% %w[APP_HOST API_HOST].each { |name| raise "#{name} must be set to a bare public hostname such as draw.example.com, got #{ENV[name].inspect}" unless ENV[name].to_s.match?(/\A[a-z0-9-]+(\.[a-z0-9-]+)+\z/i) } %>
<% raise "GITHUB_REPOSITORY_OWNER must be set to the GitHub account that owns the images" if ENV["GITHUB_REPOSITORY_OWNER"].to_s.empty? %>
service: drawhaus-backend

# Image name without registry prefix; Kamal prepends `registry.server` automatically.
image: <%= ENV["GITHUB_REPOSITORY_OWNER"].downcase %>/drawhaus-backend

ssh:
  user: deploy

servers:
  web:
    hosts:
      - <%= ENV["HOST_IP"] %>

proxy:
  ssl: false
  host: <%= ENV["API_HOST"] %>
  app_port: 4000
  healthcheck:
    interval: 10
    path: /health
    timeout: 5

registry:
  server: ghcr.io
  username: <%= ENV["GITHUB_REPOSITORY_OWNER"] %>
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  context: .
  dockerfile: apps/backend/Dockerfile
  target: production
  arch: amd64
  cache:
    type: gha

env:
  clear:
    PORT: 4000
    # Prometheus /metrics on the public hostname, gated by METRICS_TOKEN (secret).
    # Toggle on/off from the production environment (vars.METRICS_ENABLED).
    METRICS_ENABLED: "<%= ENV.fetch("METRICS_ENABLED", "false") %>"
    NODE_ENV: production
    FILES_PATH: /data/files
    FRONTEND_URL: "https://<%= ENV["APP_HOST"] %>"
    GH_REDIRECT_URI: "https://<%= ENV["API_HOST"] %>/api/auth/github/callback"
    GOOGLE_REDIRECT_URI: "https://<%= ENV["API_HOST"] %>/api/auth/google/callback"
    # Empty falls back to noreply@APP_HOST in the backend.
    FROM_EMAIL: "<%= ENV.fetch("FROM_EMAIL", "") %>"
    SENTRY_ENVIRONMENT: "<%= ENV.fetch("SENTRY_ENVIRONMENT", "production") %>"
    SENTRY_TRACES_SAMPLE_RATE: "<%= ENV.fetch("SENTRY_TRACES_SAMPLE_RATE", "0") %>"
    SENTRY_RELEASE: "<%= ENV.fetch("SENTRY_RELEASE", "") %>"
  secret:
    - COOKIE_DOMAIN
    - DATABASE_URL
    - ENCRYPTION_KEY
    - GH_CLIENT_ID
    - GH_CLIENT_SECRET
    - GOOGLE_CLIENT_ID
    - GOOGLE_CLIENT_SECRET
    - METRICS_TOKEN
    - REDIS_URL
    - RESEND_API_KEY
    - SENTRY_DSN
    - SESSION_SECRET

volumes:
  - drawhaus-uploads:/data/files
  - drawhaus-backups:/data/backups

logging:
  driver: json-file
  options:
    max-size: 50m
    max-file: "3"

accessories:
  postgres:
    image: postgres:16-alpine
    host: <%= ENV["HOST_IP"] %>
    env:
      clear:
        POSTGRES_USER: drawhaus
        POSTGRES_DB: drawhaus_production
      secret:
        - POSTGRES_PASSWORD
    directories:
      - drawhaus-pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    host: <%= ENV["HOST_IP"] %>
    port: "127.0.0.1:6379:6379"
    cmd: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    directories:
      - drawhaus-redis-data:/data

aliases:
  console: app exec --reuse --interactive 'node'
  shell: app exec --interactive 'sh'
  db: accessory exec postgres --interactive 'psql -U drawhaus drawhaus_production'
  redis: accessory exec redis --interactive 'redis-cli'
  logs: app logs -f
