services:
  workspace:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    init: true
    volumes:
      - ..:/workspaces/drawhaus:cached
      # The shell-history feature writes here (/dc/shellhistory, per its
      # devcontainer-feature.json); without the volume every rebuild starts empty.
      - devcontainer-commandhistory:/dc/shellhistory
    command: sleep infinity
    mem_limit: 8g

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: drawhaus
      POSTGRES_USER: drawhaus
      POSTGRES_PASSWORD: drawhaus
    ports:
      - "5432:5432"
    volumes:
      - devcontainer-pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6479:6379"

volumes:
  devcontainer-pgdata:
  devcontainer-commandhistory:
