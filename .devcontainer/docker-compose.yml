services:
  workspace:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    init: true
    volumes:
      - ..:/workspaces/drawhaus:cached
      # The shell-history feature writes here (/dc/shellhistory, per its
      # devcontainer-feature.json); without the volume every rebuild starts empty.
      - devcontainer-commandhistory:/dc/shellhistory
    # .host.env comes from initialize.sh, local.env from you; the later file wins. See README.md.
    env_file:
      - path: .host.env
        required: false
      - path: local.env
        required: false
    command: sleep infinity
    mem_limit: 8g

  # No host ports: the workspace reaches db and redis over the compose network, and
  # forwardPorts exposes db on a free local port, so repos sharing a host never collide.
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: drawhaus
      POSTGRES_USER: drawhaus
      POSTGRES_PASSWORD: drawhaus
    volumes:
      - devcontainer-pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped

volumes:
  devcontainer-pgdata:
  devcontainer-commandhistory:
