sonar.projectKey=drawhaus-frontend
sonar.projectName=drawhaus-frontend
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/__tests__/**,**/*.d.ts

sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Frontend deps (three.js, excalidraw, dagre) OOM SonarJS's type-aware bridge.
# These two flags trade type-aware rules for a scan that actually completes.
sonar.javascript.node.maxspace=8192
sonar.javascript.skipTypechecking=true
